[project]
name = "neural-networks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DanielHolleufer", email = "daniel.holleufer@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.6",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
skip-magic-trailing-comma = true
